server:
  port: 8083

spring:
  application:
    name: ms-carrito

  datasource:
    url: ${DB_URL:jdbc:h2:mem:pedidos360_carrito}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # Broker de mensajes (en docker-compose apunta al servicio "rabbitmq")
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # ACK/NACK explícito en PagoResultadoListener (EP3)
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2.0
          max-interval: 10000

  # Broker de eventos para monitoreo (en docker-compose apunta al servicio "kafka")
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/9150f81f-b0fc-436d-998d-dcb5cf883d2e/v2.0}

# Prueba local sin Azure (AUTH_BYPASS=true): no se exige JWT.
# Por defecto false => autenticación completa con Microsoft Entra ID.
app:
  auth:
    bypass: ${AUTH_BYPASS:false}

  # ms-productos es la fuente de verdad de precios y stock.
  # En docker-compose apunta al servicio "ms-productos".
  productos:
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8081/productos}

  # Nombres centralizados de RabbitMQ (EP3).
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:pedidos360.exchange}
    queue-email: ${RABBITMQ_QUEUE_EMAIL:pedidos360.emails}
    queue-email-dlq: ${RABBITMQ_QUEUE_EMAIL_DLQ:pedidos360.emails.dlq}
    routing-key-email: ${RABBITMQ_ROUTING_KEY_EMAIL:pedidos360.emails.routing}
    queue-pago-resultado: ${RABBITMQ_QUEUE_PAGO_RESULTADO:pedidos360.pagos.resultado}
    queue-pago-resultado-dlq: ${RABBITMQ_QUEUE_PAGO_RESULTADO_DLQ:pedidos360.pagos.resultado.dlq}
    routing-key-pago-resultado: ${RABBITMQ_ROUTING_KEY_PAGO_RESULTADO:pedidos360.pagos.resultado.routing}

  # Nombres de los tópicos Kafka (EP5)
  kafka:
    topic-monitoreo: ${KAFKA_TOPIC_MONITOREO:pedidos360.monitoreo}
    topic-navegacion: ${KAFKA_TOPIC_NAVEGACION:pedidos360.navegacion}
